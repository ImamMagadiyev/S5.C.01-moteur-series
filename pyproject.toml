[project]
name = "moteur-series"
version = "0.1.0"
description = "Moteur de recherche et de recommandation de séries TV à partir de sous-titres"
readme = "README.md"
authors = [
    { name = "Magadiyev", email = "150127025+im31200@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "nltk>=3.10.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
moteur-series = "moteur_series:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
